# Kineo configuration. Copy to ~/.config/kineo/kineo.toml and edit.
# Every key is optional: anything left out keeps the value shown here.
# Reload with hyper+shift+r or `kineo send reload-config`.

[layout]
gap = 12            # pixels between columns, and between windows stacked in a column
margin = 12         # pixels between windows and the edges of the screen; at the sides,
                    # at least a gap beyond the slivers of parked windows
sliver = 8          # how much of an off-screen window peeks in at the screen edge
focus = "reveal"    # "reveal": scroll just enough to show the focused window
                    # "center": keep the focused window in the middle
widths = [0.3333, 0.5, 0.6667, 1.0]   # presets for cycle-width, as fractions of the screen
default-width = 0.5                   # width of newly opened windows

[animation]
duration-ms = 333   # 0 turns animation off; a spring is within a few pixels by then
fps = 120           # at most; frames follow the display's refresh rate
easing = "spring"   # "spring" keeps its speed when a new command redirects it;
                    # or "linear", "ease-out", "ease-in-out"

# Key bindings merge with the defaults below; bind a chord to "none" to drop one.
# Modifiers: cmd, alt, ctrl, shift, hyper (= cmd+alt+ctrl), meh (= ctrl+alt+shift).
# `kineo commands` lists every command.
[bindings]
"hyper+a" = "focus-left"
"hyper+d" = "focus-right"
"hyper+w" = "focus-up"
"hyper+s" = "focus-down"
"hyper+h" = "focus-first"
"hyper+l" = "focus-last"
"hyper+shift+a" = "move-left"
"hyper+shift+d" = "move-right"
"hyper+shift+w" = "move-up"
"hyper+shift+s" = "move-down"
"hyper+c" = "cycle-width"
"hyper+shift+c" = "cycle-width-back"
"hyper+f" = "toggle-full-width"
"hyper+m" = "center"             # the middle of the screen
"hyper+comma" = "consume"        # stack this window under the column to its left
"hyper+period" = "expel"         # take this window out of its stack
"hyper+p" = "toggle-float"       # pop the window out of the strip, or back in
"hyper+r" = "retile"
"hyper+shift+r" = "reload-config"
"hyper+shift+q" = "quit"
"hyper+delete" = "close"         # close the focused window, as its close button would
# "exec" runs a shell command. This one opens an iTerm window with the
# "Kineo" profile if there is one: copy config/iterm-profile.json to
# ~/Library/Application Support/iTerm2/DynamicProfiles/ for no title bar.
"hyper+return" = "exec osascript -e 'if application \"iTerm\" is running then' -e 'tell application \"iTerm\"' -e 'try' -e 'create window with profile \"Kineo\"' -e 'on error' -e 'create window with default profile' -e 'end try' -e 'end tell' -e 'end if' -e 'tell application \"iTerm\" to activate'"

# Rules are checked in order; the first whose fields all match applies.
# Setting any rules replaces this default list.
[[rules]]
app = "com.apple.systempreferences"
float = true

[[rules]]
app = "com.apple.ActivityMonitor"
float = true

